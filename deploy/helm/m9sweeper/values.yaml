global:
  # Historical keys retained for compatibility; do NOT place plaintext secrets in values files.
  jwtSecret: ""
  apiKey: ""
  existingSecret: m9sweeper-credentials
  baseUrl: "http://localhost:3000"
  postgres:
    host: "postgresql.example.internal"
    port: 5432
    database: m9sweeper
    username: m9sweeper
    existingSecret: m9sweeper-credentials
  security:
    allowInlineSecrets: false

dash:
  init:
    clusterGroupName: default-cluster-group
    clusterName: default-cluster
    superAdminEmail: ""
    superAdminPassword: ""
  image:
    repository: ""  # supply immutable reviewed image tag/digest
    tag: ""
    digest: ""
  replicas: 1
  service:
    port: 3000
  ingress:
    enabled: false
    className: ""
    host: ""
    tlsSecretName: ""

backend:
  image:
    repository: ""
    tag: ""
    digest: ""
  replicas: 2
  service:
    port: 8080
  admission:
    enabled: false # require configured certificates, policy cache, live tests before enforcement
    failurePolicy: Fail

trawler:
  image:
    repository: ""
    tag: ""
    digest: ""
  replicas: 1
  scanSchedule: "0 */6 * * *"
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    readOnlyRootFilesystem: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

integrations:
  trivy:
    enabled: true
  kubeBench:
    enabled: false # node-level deployment requires OS-specific permissions / separate chart
  kubesec:
    enabled: false
  kubeHunter:
    enabled: false
  falco:
    enabled: false # connect existing Falco forwarder rather than privileged default deployment
  policies:
    vapEnabled: true
    webhookEnabled: false
