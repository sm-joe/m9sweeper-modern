{{- if .Values.dash.ingress.enabled }}
{{- if not .Values.dash.ingress.host }}{{ fail "dash.ingress.host required" }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: m9-dash
spec:
  {{- with .Values.dash.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.dash.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ $.Values.dash.ingress.host | quote }}]
      secretName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.dash.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: m9-dash
                port:
                  number: {{ .Values.dash.service.port }}
{{- end }}
