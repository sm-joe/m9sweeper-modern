version: "3.9"

volumes:
  m9sweeperDbData:
    driver: local

services:
  rabbitmq:
    image: rabbitmq:3.12-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME in .env}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}"
    container_name: rabbitmq
    restart: always
    ports:
      - '127.0.0.1:56729:5672'
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      start_period: 15s
      interval: 10s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15.3-alpine
    container_name: postgres
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER" ]
      interval: 15s
      timeout: 30s
      retries: 3
      start_period: 3s
    environment:
      POSTGRES_DB: "${DATABASE_NAME}"
      POSTGRES_USER: "${DATABASE_USER}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD}"
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - m9sweeperDbData:/var/lib/postgresql/data

  dash-init:
    build: ..
    image: m9sweeper-dash
    container_name: dash-init
    entrypoint: "npm run cli:init:all"
    depends_on:
      postgres:
        condition: service_healthy
      dash:
        condition: service_healthy
    environment:
      SERVER_BASE_URL: "http://localhost:3000"
      DATABASE_CONNECTION_HOST: "postgres"
      DATABASE_CONNECTION_DATABASE: "${DATABASE_NAME}"
      DATABASE_CONNECTION_USERNAME: "${DATABASE_USER}"
      DATABASE_CONNECTION_PASSWORD: "${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}"
      DATABASE_MIGRATION_ENABLED: 1
      # Init CLI imports shared configuration; supply the same broker identity as Dash.
      RABBITMQ_USER_NAME: "${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME in .env}"
      RABBITMQ_USER_PASSWORD: "${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}"
      TRAWLER_API_KEY: "${TRAWLER_API_KEY:?set TRAWLER_API_KEY in .env}"
      FALCO_API_KEY: "${FALCO_API_KEY:?set FALCO_API_KEY in .env}"
      KUBE_HUNTER_API_KEY: "${KUBE_HUNTER_API_KEY:?set KUBE_HUNTER_API_KEY in .env}"
      KUBE_BENCH_API_KEY: "${KUBE_BENCH_API_KEY:?set KUBE_BENCH_API_KEY in .env}"
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:?set SUPER_ADMIN_EMAIL in .env}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:?set SUPER_ADMIN_PASSWORD in .env}"
      CLI_PATH: "./cli.js"
      INITIAL_REGISTRIES_JSON: "${INITIAL_REGISTRIES_JSON}"

  dash:
    build: ..
    image: m9sweeper-dash
    container_name: m9sweeper-dash
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1
      interval: 30s
      retries: 3
      start_period: 20s
      timeout: 10s
    environment:
      SERVER_BASE_URL: "${SERVER_BASE_URL}"
      SCANNER_REPORT_INGESTION_URL: "${SCANNER_REPORT_INGESTION_URL:-}"
      SCANNER_REQUIRE_CLUSTER_BINDINGS: "${SCANNER_REQUIRE_CLUSTER_BINDINGS:-false}"
      SCANNER_ALLOW_LEGACY_QUERY_KEYS: "${SCANNER_ALLOW_LEGACY_QUERY_KEYS:-false}"
      SCANNER_ALLOW_LEGACY_KEY_EXPORT: "${SCANNER_ALLOW_LEGACY_KEY_EXPORT:-false}"
      DATABASE_CONNECTION_HOST: "postgres"
      DATABASE_CONNECTION_DATABASE: "${DATABASE_NAME}"
      DATABASE_CONNECTION_USERNAME: "${DATABASE_USER}"
      DATABASE_CONNECTION_PASSWORD: "${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}"
      DATABASE_MIGRATION_ENABLED: 1
      # Email
      EMAIL_CONFIG_USE: "SMTP"
      EMAIL_SMTP_SECURE_CONNECTION: 1
      EMAIL_SMTP_HOST: "${EMAIL_SMTP_HOST}"
      EMAIL_SMTP_PORT: "${EMAIL_SMTP_PORT}"
      EMAIL_DEFAULT_SENDER_EMAIL: "${EMAIL_DEFAULT_SENDER_EMAIL}"
      EMAIL_SMTP_AUTH_USER: "${EMAIL_SMTP_AUTH_USER}"
      EMAIL_SMTP_AUTH_PASSWORD: "${EMAIL_SMTP_AUTH_PASSWORD}"

      # Rabbit mq
      MSG_QUEUE_NAME_IMAGE_SCANNER: "trawler_queue"
      RABBITMQ_HOST_NAME: rabbitmq
      RABBITMQ_HOST_PORT: 5672
      RABBITMQ_USER_NAME: "${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME in .env}"
      RABBITMQ_USER_PASSWORD: "${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}"

      # Cron
      NODE_CRON_ENABLED: "${NODE_CRON_ENABLED}"
      CLUSTER_SCRAPE_SCHEDULE: "${CLUSTER_SCRAPE_SCHEDULE}"
      GATEKEEPER_EXCEPTION_SYNC_SCHEDULE: "${GATEKEEPER_EXCEPTION_SYNC_SCHEDULE}"
      KUBERNETES_HISTORY_SCHEDULE: "${KUBERNETES_HISTORY_SCHEDULE}"
      UPDATE_EXCEPTION_STATUS_SCHEDULE: "${UPDATE_EXCEPTION_STATUS_SCHEDULE}"

      # Misc
      SECURITY_JWT_SECRET: "${SECURITY_JWT_SECRET:?set SECURITY_JWT_SECRET in .env}"
      KUBESEC_URL: "http://kubesec:${KUBESEC_PORT}"

  trawler:
    build:
      context: ../trawler
      dockerfile: Dockerfile.jvm
    image: m9sweeper-trawler
    container_name: m9sweeper-trawler
    restart: always
    environment:
      # TrawlerConfig
      TRAWLER_PARALLEL_SCANNERS: 1
      TRAWLER_RUN_MODE: rabbitmq
      DEBUG: "${TRAWLER_DEBUG}"
      # Rabbit MQ Connection
      RABBITMQ_HOSTNAME: "rabbitmq"
      RABBITMQ_USERNAME: "${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME in .env}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}"
      RABBITMQ_PORT: 5672
      # Dash Connection
      M9SWEEPER_URL: "http://dash:3000"
      M9SWEEPER_API_KEY: "${TRAWLER_API_KEY:?set TRAWLER_API_KEY in .env}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      dash:
        condition: service_healthy

  kubesec:
    image: kubesec/kubesec:v2.13.0
    container_name: kubesec
    restart: always
    platform: linux/amd64
    command: ["http", "${KUBESEC_PORT}"]
    ports:
      - '127.0.0.1:${KUBESEC_PORT}:${KUBESEC_PORT}'
