{{/*
Standard installation profile. PostgreSQL 17 and RabbitMQ 4.4 may be
provided by this chart or as external services.
External Secret values are references, not raw secret values in Helm history.
*/}}
{{- if (dig "installation" "enabled" false .Values.global) }}
{{- if .Values.global.postgres.enabled }}
{{- if not (regexMatch "^17([.-]|$)" (toString .Values.postgresql.image.tag)) }}
{{- fail "Installation profile: bundled PostgreSQL must use version 17" }}
{{- end }}
{{- if ne (toString .Values.postgresql.postgresql.existingSecret) (toString .Values.dash.existingSecret) }}
{{- fail "Installation profile: PostgreSQL credentials Secret must match dash.existingSecret" }}
{{- end }}
{{- end }}
{{- if .Values.global.rabbitmq.enabled }}
{{- if not (regexMatch "^4[.]4([.-]|$)" (toString .Values.rabbitmq.image.tag)) }}
{{- fail "Installation profile: bundled RabbitMQ must use version 4.4" }}
{{- end }}
{{- if ne (toString .Values.rabbitmq.existingSecret) (toString .Values.dash.existingSecret) }}
{{- fail "Installation profile: RabbitMQ credentials Secret must match dash.existingSecret" }}
{{- end }}
{{- end }}
{{- if not (and .Values.dash.existingSecret .Values.dash.init.existingSecret .Values.trawler.existingSecret) }}
{{- fail "Installation profile: dash.existingSecret, dash.init.existingSecret and trawler.existingSecret must reference pre-created Kubernetes Secrets" }}
{{- end }}
{{- range $component := list "dash" "trawler" }}
{{- $image := index $.Values $component "image" }}
{{- if not (regexMatch "^[^@]+@sha256:[a-f0-9]{64}$" (toString $image.tag)) }}
{{- fail (printf "Installation profile: %s.image.tag must include an immutable @sha256: digest from the signed release candidate" $component) }}
{{- end }}
{{- end }}
{{- if and (dig "validatingWebhook" "enabled" false .Values.dash) (not (dig "validatingWebhook" "caBundle" "" .Values.dash)) }}
{{- fail "Installation profile: admission webhook cannot be enabled without a verified CA bundle" }}
{{- end }}
{{- end }}
