{{- if and (not .Values.dash.existingSecret) (or (lt (len (.Values.global.jwtSecret | default "")) 32) (eq .Values.global.jwtSecret "this-is-not-secret")) }}
{{- fail "Set global.jwtSecret to a unique random secret (minimum 32 characters) or provide dash.existingSecret" }}
{{- end }}
{{- if and (or (not .Values.trawler.existingSecret) (not .Values.dash.init.existingSecret)) (lt (len (.Values.global.apiKey | default "")) 32) }}
{{- fail "Set global.apiKey to a unique random API key (minimum 32 characters) or provide both trawler.existingSecret and dash.init.existingSecret" }}
{{- end }}
{{- if not .Values.dash.init.existingSecret }}
{{- if not (.Values.dash.init.superAdminEmail | default "") }}
{{- fail "Set dash.init.superAdminEmail or dash.init.existingSecret" }}
{{- end }}
{{- if lt (len (.Values.dash.init.superAdminPassword | default "")) 16 }}
{{- fail "Set dash.init.superAdminPassword (minimum 16 chars) or dash.init.existingSecret" }}
{{- end }}
{{- end }}
{{- if and (.Values.global.jwtSecret | default "") (.Values.global.apiKey | default "") (eq .Values.global.jwtSecret .Values.global.apiKey) }}
{{- fail "global.jwtSecret and global.apiKey must be distinct" }}
{{- end }}
