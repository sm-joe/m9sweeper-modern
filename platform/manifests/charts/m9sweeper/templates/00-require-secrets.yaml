{{- if or (lt (len (.Values.global.jwtSecret | default "")) 32) (eq .Values.global.jwtSecret "this-is-not-secret") }}
{{- fail "Set global.jwtSecret to a unique random secret (minimum 32 characters)" }}
{{- end }}
{{- if lt (len (.Values.global.apiKey | default "")) 32 }}
{{- fail "Set global.apiKey to a unique random API key (minimum 32 characters)" }}
{{- end }}
{{- if not (.Values.dash.init.superAdminEmail | default "") }}
{{- fail "Set dash.init.superAdminEmail" }}
{{- end }}
{{- if lt (len (.Values.dash.init.superAdminPassword | default "")) 16 }}
{{- fail "Set dash.init.superAdminPassword to a strong unique password (at least 16 characters)" }}
{{- end }}
{{- if eq .Values.global.jwtSecret .Values.global.apiKey }}
{{- fail "global.jwtSecret and global.apiKey must be distinct" }}
{{- end }}
