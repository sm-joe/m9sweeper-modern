{{/* Upgrades must not suggest resetting an existing JWT/API identity. */}}
{{- if and .Release.IsUpgrade (not (.Values.dash.existingSecret | default "")) }}
{{- fail "Upgrade is missing the Helm value dash.existingSecret. This does NOT mean the Kubernetes Secret or JWT is missing. Pass the existing Dash Secret name with --set-string dash.existingSecret=m9-dash-env (and existing init/trawler Secret references). Do not generate global.jwtSecret or replace existing credentials." }}
{{- end }}
{{- if and .Release.IsUpgrade (not (.Values.dash.init.existingSecret | default "")) }}
{{- fail "Upgrade is missing dash.init.existingSecret in stored Helm values. Pass --set-string dash.init.existingSecret=m9-init-env to reference the existing bootstrap Secret. Do not regenerate scanner API keys." }}
{{- end }}
{{- if and .Release.IsUpgrade (not (.Values.trawler.existingSecret | default "")) }}
{{- fail "Upgrade is missing trawler.existingSecret in stored Helm values. Pass --set-string trawler.existingSecret=m9-trawler-env to reference the existing scanner Secret. Do not recreate or rotate credentials." }}
{{- end }}
{{- if and (not .Values.dash.existingSecret) (or (lt (len (.Values.global.jwtSecret | default "")) 32) (eq .Values.global.jwtSecret "this-is-not-secret")) }}
{{- fail "Set global.jwtSecret to a unique random secret (minimum 32 characters) or provide dash.existingSecret" }}
{{- end }}
{{- if and (or (not .Values.trawler.existingSecret) (not .Values.dash.init.existingSecret)) (lt (len (.Values.global.apiKey | default "")) 32) }}
{{- fail "Set global.apiKey to a unique random API key (minimum 32 characters) or provide both trawler.existingSecret and dash.init.existingSecret" }}
{{- end }}
{{- if not .Values.dash.init.existingSecret }}
{{- if not (.Values.dash.init.superAdminEmail | default "") }}
{{- fail "Set dash.init.superAdminEmail or dash.init.existingSecret" }}
{{- end }}
{{- if lt (len (.Values.dash.init.superAdminPassword | default "")) 16 }}
{{- fail "Set dash.init.superAdminPassword (minimum 16 chars) or dash.init.existingSecret" }}
{{- end }}
{{- end }}
{{- if and (.Values.global.jwtSecret | default "") (.Values.global.apiKey | default "") (eq .Values.global.jwtSecret .Values.global.apiKey) }}
{{- fail "global.jwtSecret and global.apiKey must be distinct" }}
{{- end }}
