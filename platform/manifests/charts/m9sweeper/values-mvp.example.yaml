# External PostgreSQL, RabbitMQ and pre-created Secret references.
# Set immutable image references when using a newly packaged chart.
global:
  installation:
    enabled: true
  postgres:
    enabled: false
  rabbitmq:
    enabled: false

dash:
  existingSecret: m9-dash-env
  init:
    existingSecret: m9-init-env
  image:
    registry: ghcr.io
    repository: sm-joe/m9sweeper-dash
    tag: 'v0.1.0-rc1@sha256:REPLACE_WITH_VERIFIED_64_HEX_DIGEST'
  # Keep admission webhook off until its CA/TLS fail-closed behavior is tested.
  validatingWebhook:
    enabled: false

trawler:
  existingSecret: m9-trawler-env
  image:
    registry: ghcr.io
    repository: sm-joe/m9sweeper-trawler
    tag: 'v0.1.0-rc1@sha256:REPLACE_WITH_VERIFIED_64_HEX_DIGEST'
