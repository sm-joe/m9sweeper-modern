apiVersion: v2
name: m9sweeper
version: 0.0.0
kubeVersion: '>=1.35.0-0 <1.38.0-0'
description: "m9sweeper: a tool to secure your kubernetes cluster and images"
type: application
keywords:
  - m9sweeper
  - analysis
  - docker
  - image
  - security
  - vulnerability
  - scanner
home: "https://m9sweeper.io"
dependencies:
  - name: dash
    version: 0.0.0
    repository: "file://../dash"
  - name: trawler
    version: 0.0.0
    repository: "file://../trawler"
  - name: rabbitmq
    version: 0.0.0
    repository: "file://../rabbitmq"
    condition: global.rabbitmq.enabled
  - name: postgresql
    version: 0.0.0
    repository: "file://../postgres"
    condition: global.postgres.enabled
maintainers:
  - name: m9sweeper Support Team
    email: info@m9sweeper.io
appVersion: 0.0.0
