{{- if .Values.cronjob.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ template "kube-hunter.fullname" . }}
  labels:
    app: {{ template "kube-hunter.name" . }}
    chart: {{ template "kube-hunter.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  {{- with .Values.cronjob.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  schedule: "{{ .Values.cronjob.schedule }}"
  {{- with .Values.cronjob.concurrencyPolicy }}
  concurrencyPolicy: {{ . }}
  {{- end }}
  {{- with .Values.cronjob.failedJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ . }}
  {{- end }}
  {{- with .Values.cronjob.successfulJobsHistoryLimit }}
  successfulJobsHistoryLimit: {{ . }}
  {{- end }}
  jobTemplate:
    metadata:
      labels:
        app: {{ template "kube-hunter.name" . }}
        release: {{ .Release.Name }}
    spec:
      template:
        metadata:
          labels:
            app: {{ template "kube-hunter.name" . }}
            release: {{ .Release.Name }}
          {{- with .Values.pod.annotations }}
          annotations:
{{ toYaml . | indent 12 }}
          {{- end }}
        spec:
          serviceAccount: {{ include "kube-hunter.serviceAccountName" . }}
{{- if .Values.securityContext.enabled }}
          securityContext:
            fsGroup: {{ .Values.securityContext.fsGroup }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.securityContext.runAsUser }}
{{- end }}
          restartPolicy: Never
{{- if .Values.priorityClassName }}
          priorityClassName: "{{ .Values.priorityClassName }}"
{{- end }}
{{- if .Values.reportRelay.enabled }}
          initContainers:
            - name: report-relay
              restartPolicy: Always
              startupProbe:
                exec:
                  command:
                    - python
                    - -c
                    - "import socket; s=socket.create_connection(('127.0.0.1', 8765), 2); s.close()"
                periodSeconds: 1
                failureThreshold: 30
              image: {{ .Values.reportRelay.image | quote }}
              imagePullPolicy: IfNotPresent
              command: ["python", "-B", "/opt/report-relay/relay.py"]
              env:
                - name: REPORT_RELAY_TARGET_URL
                  value: {{ .Values.reportRelay.targetUrl | quote }}
{{- if .Values.reportRelay.caSecret }}
                - name: SSL_CERT_FILE
                  value: /etc/report-relay-tls/ca.crt
{{- end }}
                - name: REPORT_RELAY_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.reportRelay.existingSecret | quote }}
                      key: {{ .Values.reportRelay.secretKey | quote }}
              volumeMounts:
                - name: relay-code
                  mountPath: /opt/report-relay
                  readOnly: true
{{- if .Values.reportRelay.caSecret }}
                - name: relay-ca
                  mountPath: /etc/report-relay-tls
                  readOnly: true
{{- end }}
              resources:
{{ toYaml .Values.reportRelay.resources | indent 16 }}
{{- end }}
          containers:
            - name: {{ .Chart.Name }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["kube-hunter"]
              args:
                - "--pod"
                - "--report=json"
                - "--dispatch=http"
                {{- with .Values.customArguments }}
{{ toYaml . | indent 16 }}
                {{- end }}
              env:
              - name: KUBEHUNTER_HTTP_DISPATCH_URL
{{- if .Values.reportRelay.enabled }}
                value: "http://127.0.0.1:8765/"
{{- else }}
                valueFrom:
                  secretKeyRef:
                    name: {{ required "dispatchAuth.existingSecret is required in legacy mode" .Values.dispatchAuth.existingSecret | quote }}
                    key: {{ .Values.dispatchAuth.secretKey | quote }}
{{- end }}
              resources:
{{ toYaml .Values.resources | indent 16 }}

{{- if .Values.reportRelay.enabled }}
          volumes:
            - name: relay-code
              configMap:
                name: {{ include "kube-hunter.fullname" . }}-relay
{{- if .Values.reportRelay.caSecret }}
            - name: relay-ca
              secret:
                secretName: {{ .Values.reportRelay.caSecret | quote }}
                items:
                  - key: {{ .Values.reportRelay.caSecretKey | quote }}
                    path: ca.crt
{{- end }}
{{- end }}
    {{- with .Values.nodeSelector }}
          nodeSelector:
{{ toYaml . | indent 12 }}
    {{- end }}
    {{- with .Values.affinity }}
          affinity:
{{ toYaml . | indent 12 }}
    {{- end }}
    {{- with .Values.tolerations }}
          tolerations:
{{ toYaml . | indent 12 }}
{{- end }}
{{- end }}
