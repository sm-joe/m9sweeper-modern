name: Publish m9sweeper release
on:
  workflow_run:
    workflows: ['Kubernetes release acceptance']
    types: [completed]
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to publish (e.g. v0.1.3)
        type: string
        required: true
        default: v0.1.3
      source_sha:
        description: Exact successful source SHA
        type: string
        required: true
      candidate_run_id:
        description: Successful immutable signed candidate workflow run ID
        type: string
        required: true
      acceptance_run_id:
        description: Successful independent downloaded-chart acceptance run ID
        type: string
        required: true
      confirmation:
        description: Gate token SIGNED_AND_ACCEPTED
        type: string
        required: true
      cleanup_old_releases:
        description: Delete v0.1.0, v0.1.1 and v0.1.2 only after v0.1.3 is published and verified
        type: boolean
        required: false
        default: false
      scanner_acceptance:
        description: Type KUBE_HUNTER_TRIVY_FALCO_VERIFIED only after independent real scanner and UI acceptance
        type: string
        required: true
permissions:
  contents: write
  actions: read
  packages: read
jobs:
  publish-release:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'SIGNED_AND_ACCEPTED' &&
      inputs.scanner_acceptance == 'KUBE_HUNTER_TRIVY_FALCO_VERIFIED' &&
      inputs.source_sha == github.sha &&
      github.repository == 'sm-joe/m9sweeper-modern'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@v3
      - name: Require exact SHA candidate and full platform success
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GH_REPO" = 'sm-joe/m9sweeper-modern'
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -s ATTRIBUTION.md
          test -s platform/LICENSE
          test -s docs/release-notes.md
          version='${{ inputs.release_version }}'
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Release must be a clean vMAJOR.MINOR.PATCH version' >&2; exit 2
          }
          if gh release view "$version" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing release' >&2; exit 1
          fi
          gh run list --workflow ci.yml --limit 50 \
            --json databaseId,headSha,conclusion > /tmp/platform-runs.json
          jq -e --arg sha "$SOURCE_SHA" \
            'any(.[]; .headSha == $sha and .conclusion == "success")' \
            /tmp/platform-runs.json >/dev/null || {
            echo 'Exact-source full platform CI is not green; public release refused' >&2
            exit 1
          }
          [[ "${{ inputs.candidate_run_id }}" =~ ^[1-9][0-9]*$ &&
             "${{ inputs.acceptance_run_id }}" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Invalid candidate or acceptance workflow run identifier' >&2; exit 2
          }
          echo 'CANDIDATE_RUN=${{ inputs.candidate_run_id }}' >> "$GITHUB_ENV"
          acceptance_id='${{ inputs.acceptance_run_id }}'
          accepted=0
          # Workflow dispatch may be enqueued while acceptance job is
          # finalizing. Never publish unless that job completes successfully.
          for attempt in {1..60}; do
            evidence="$(gh run view "$acceptance_id" --json name,status,conclusion,headSha)"
            if jq -e --arg sha "$SOURCE_SHA" '
              .name == "Kubernetes release acceptance"
              and .headSha == $sha and .status == "completed"
              and .conclusion == "success"' <<<"$evidence" >/dev/null; then
              accepted=1; break
            fi
            if jq -e '.status == "completed"' <<<"$evidence" >/dev/null; then
              echo 'Independent native Linux candidate acceptance failed' >&2; exit 1
            fi
            sleep 5
          done
          [[ "$accepted" == 1 ]] || {
            echo 'Independent acceptance run did not complete successfully' >&2; exit 1
          }
          candidate="$(gh run view "${{ inputs.candidate_run_id }}" --json name,status,conclusion,headSha)"
          jq -e --arg sha "$SOURCE_SHA" '
            .name == "Build and sign m9sweeper release"
            and .headSha == $sha and .status == "completed"
            and .conclusion == "success"' <<<"$candidate" >/dev/null || {
            echo 'Exact-source candidate has not passed signing' >&2; exit 1
          }
      - name: Download artifacts from exactly accepted signed candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$CANDIDATE_RUN" \
            --name "m9sweeper-signed-linux-candidate-$SOURCE_SHA" \
            --dir dist
          (cd dist && sha256sum -c SHA256SUMS)
          test -s dist/m9sweeper-source.spdx.json
          python3 -m json.tool dist/m9sweeper-source.spdx.json >/dev/null
          expected_version='${{ inputs.release_version }}'
          grep -Fxq "version=$expected_version" dist/RELEASE-METADATA.txt || {
            echo 'Release tag does not match signed chart/image build version' >&2; exit 1
          }
          test -s "dist/m9sweeper-${expected_version#v}.tgz" || {
            echo 'Exact versioned Helm package missing' >&2; exit 1
          }
          for scanner in kube-bench kube-hunter; do
            test -s "dist/$scanner-${expected_version#v}.tgz" || {
              echo "Missing independently installable $scanner chart" >&2; exit 1
            }
            test -s "dist/$scanner.sigstore.json"
          done
      - name: Verify OCI and Helm artifact signatures before release
        shell: bash
        run: |
          set -euo pipefail
          identity='https://github.com/sm-joe/m9sweeper-modern/.github/workflows/release-build.yml@refs/heads/main'
          issuer='https://token.actions.githubusercontent.com'
          shopt -s nullglob
          charts=(dist/m9sweeper-*.tgz)
          test "${#charts[@]}" -eq 1
          cosign verify-blob --bundle dist/chart.sigstore.json \
            --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" \
            "${charts[0]}"
          version='${{ inputs.release_version }}'
          for scanner in kube-bench kube-hunter; do
            cosign verify-blob --bundle "dist/$scanner.sigstore.json" \
              --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" \
              "dist/$scanner-${version#v}.tgz"
          done
          for name in dash trawler; do
            image="$(sed -n "s/^$name=//p" dist/IMAGE-DIGESTS.txt)"
            [[ "$image" =~ ^ghcr.io/sm-joe/m9sweeper-(dash|trawler)@sha256:[a-f0-9]{64}$ ]]
            cosign verify --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" "$image" >/dev/null
          done
          echo 'PASS: verified source, chart signature and OCI digests'
      - name: Publish release with verified downloadable assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          version="${{ inputs.release_version }}"
          gh release create "$version" \
            dist/*.tgz dist/SHA256SUMS dist/IMAGE-DIGESTS.txt \
            dist/*.sigstore.json dist/m9sweeper-source.spdx.json \
            dist/RELEASE-METADATA.txt dist/INSTALL.md \
            --target "$SOURCE_SHA" \
            --title "m9sweeper-modern $version" \
            --notes-file docs/release-notes.md
          echo 'PASS: release published after full CI, signed artifacts and Kubernetes scan acceptance'
      - name: Remove superseded GitHub releases only after successful publication
        if: ${{ success() && inputs.cleanup_old_releases }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version='${{ inputs.release_version }}'
          [[ "$version" == v0.1.3 ]] || {
            echo 'Cleanup is permitted only after publishing v0.1.3' >&2
            exit 1
          }
          gh release view "$version" --json tagName,isDraft,isPrerelease,assets \
            --jq 'select(.tagName == "v0.1.3" and .isDraft == false and .isPrerelease == false and (.assets | length) >= 6) | .tagName' | grep -Fxq "$version"
          for old in v0.1.0 v0.1.1 v0.1.2; do
            if gh release view "$old" >/dev/null 2>&1; then
              gh release delete "$old" --yes --cleanup-tag
              echo "Removed superseded release and tag: $old"
            fi
          done


  publish-approved-v013:
    name: Publish signed v0.1.3 after independent acceptance
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.repository == 'sm-joe/m9sweeper-modern'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      ACCEPTANCE_RUN_ID: ${{ github.event.workflow_run.id }}
      VERSION: v0.1.3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Confirm exact approved release source, acceptance and main ref
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" = "$SOURCE_SHA"
          git show -s --format=%B HEAD | grep -Fq '[publish:v0.1.3]'
          gh run view "$ACCEPTANCE_RUN_ID" --json name,headSha,status,conclusion \
            | jq -e --arg sha "$SOURCE_SHA" '.name == "Kubernetes release acceptance" and .headSha == $sha and .status == "completed" and .conclusion == "success"'
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo 'Version already published, refusing to modify immutable release'
            exit 1
          fi
      - name: Require full Platform CI success and signed candidate at exact source
        shell: bash
        run: |
          set -euo pipefail
          success_ci=0
          for attempt in $(seq 1 90); do
            gh run list --workflow ci.yml --limit 75 --json headSha,status,conclusion > /tmp/m9-ci-runs.json
            if jq -e --arg sha "$SOURCE_SHA" 'any(.[]; .headSha == $sha and .status == "completed" and .conclusion == "success")' /tmp/m9-ci-runs.json >/dev/null; then
              success_ci=1
              break
            fi
            sleep 8
          done
          test "$success_ci" = 1 || { echo 'Exact source Platform CI not successful'; exit 1; }
          gh run list --workflow release-build.yml --limit 75 --json databaseId,headSha,status,conclusion > /tmp/m9-build-runs.json
          candidate_id="$(jq -r --arg sha "$SOURCE_SHA" '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success")] | sort_by(.databaseId) | last | .databaseId // empty' /tmp/m9-build-runs.json)"
          [[ "$candidate_id" =~ ^[1-9][0-9]*$ ]] || { echo 'No signed candidate for accepted SHA'; exit 1; }
          gh run view "$candidate_id" --json name,headSha,status,conclusion \
            | jq -e --arg sha "$SOURCE_SHA" '.name == "Build and sign m9sweeper release" and .headSha == $sha and .status == "completed" and .conclusion == "success"'
          echo "CANDIDATE_RUN_ID=$candidate_id" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@v3
      - name: Download and independently verify candidate assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$CANDIDATE_RUN_ID" --name "m9sweeper-signed-linux-candidate-$SOURCE_SHA" --dir dist
          test -s dist/RELEASE-METADATA.txt
          grep -Fxq "source_commit=$SOURCE_SHA" dist/RELEASE-METADATA.txt
          grep -Fxq "version=$VERSION" dist/RELEASE-METADATA.txt
          (cd dist && sha256sum -c SHA256SUMS)
          for name in m9sweeper kube-bench kube-hunter; do
            test -s "dist/$name-0.1.3.tgz"
          done
          test -s dist/IMAGE-DIGESTS.txt
          test -s dist/m9sweeper-source.spdx.json
          python3 -m json.tool dist/m9sweeper-source.spdx.json >/dev/null
          identity='https://github.com/sm-joe/m9sweeper-modern/.github/workflows/release-build.yml@refs/heads/main'
          issuer='https://token.actions.githubusercontent.com'
          cosign verify-blob --bundle dist/chart.sigstore.json --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" dist/m9sweeper-0.1.3.tgz
          for scanner in kube-bench kube-hunter; do
            cosign verify-blob --bundle "dist/$scanner.sigstore.json" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "dist/$scanner-0.1.3.tgz"
          done
          for name in dash trawler; do
            image="$(sed -n "s/^$name=//p" dist/IMAGE-DIGESTS.txt)"
            [[ "$image" =~ ^ghcr.io/sm-joe/m9sweeper-(dash|trawler)@sha256:[a-f0-9]{64}$ ]]
            cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$image" >/dev/null
          done
      - name: Publish audited v0.1.3 with explicit remaining acceptance limits
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/m9-v013-notes.md <<'NOTES'
          # m9sweeper-modern v0.1.3

          ## Updates
          - Angular/NestJS security dashboard, Trivy Java Trawler and private ECR scanning using workload identity.
          - Fail-closed failed scan handling and regression tests.
          - Updated kube-bench and kube-hunter install dialogs and Secret prerequisites; EKS kube-bench uses the corrected benchmark.
          - Modern eBPF Falco installation and Falcosidekick Secret configuration.
          - Security Audit PDF generation: bundled assets, correct report filters and missing-data handling.

          ## Verification
          Full Platform CI, signed OCI images and Helm charts, and independent downloaded-chart Kind install, PostgreSQL/RabbitMQ startup, authenticated login, Trivy scan ingestion, Helm upgrade and rollback passed for the exact release source.
          Operator previously confirmed EKS ECR image scanning, kube-bench, Kubesec and Falco detection.

          ## Outstanding live integrations
          Falcosidekick event forwarding into the Dashboard and live kube-hunter report-to-Dashboard delivery have not been independently verified on the EKS deployment. Native unattended EKS/AKS/GKE kubeconfig token refresh is also pending. These are not claimed as verified by the release.

          Preserve existing Kubernetes Secrets, PostgreSQL data and Helm values when upgrading. Back up PostgreSQL first.
          NOTES
          gh release create "$VERSION" \
            dist/*.tgz dist/SHA256SUMS dist/IMAGE-DIGESTS.txt \
            dist/*.sigstore.json dist/m9sweeper-source.spdx.json \
            dist/RELEASE-METADATA.txt dist/INSTALL.md \
            --target "$SOURCE_SHA" \
            --title "m9sweeper-modern $VERSION" --notes-file /tmp/m9-v013-notes.md
      - name: Verify public release assets and clean superseded releases
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$VERSION" --json tagName,isDraft,isPrerelease,assets \
            | jq -e '.tagName == "v0.1.3" and .isDraft == false and .isPrerelease == false and ([.assets[].name] | index("m9sweeper-0.1.3.tgz") != null and index("kube-bench-0.1.3.tgz") != null and index("kube-hunter-0.1.3.tgz") != null and index("SHA256SUMS") != null and index("IMAGE-DIGESTS.txt") != null)'
          mkdir -p /tmp/m9-public-release
          gh release download "$VERSION" --dir /tmp/m9-public-release
          (cd /tmp/m9-public-release && sha256sum -c SHA256SUMS)
          cmp dist/IMAGE-DIGESTS.txt /tmp/m9-public-release/IMAGE-DIGESTS.txt
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --jq .object.sha)" = "$SOURCE_SHA"
          for old in v0.1.0 v0.1.1 v0.1.2; do
            if gh release view "$old" >/dev/null 2>&1; then
              gh release delete "$old" --yes --cleanup-tag
              echo "Removed superseded version: $old"
            fi
          done
          gh release view "$VERSION" --json tagName,url,assets --jq '{tagName,url,assets: [.assets[].name]}'
