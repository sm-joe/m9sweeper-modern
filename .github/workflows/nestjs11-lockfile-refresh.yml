name: Temporary NestJS 11 lockfile regeneration
on:
  push:
    branches:
      - modernize/nestjs11-upgrade-probe
    paths:
      - 'platform/dash/backend/package.json'
      - '.github/workflows/nestjs11-lockfile-refresh.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Regenerate committed npm lockfile from exact manifest
        working-directory: platform/dash/backend
        run: |
          npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run build:api
          npm test -- --runInBand
      - name: Commit validated lockfile change to this temporary branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add platform/dash/backend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(nest11): regenerate validated locked dependency graph'
            git push origin HEAD:modernize/nestjs11-upgrade-probe
          fi
