name: Public MVP Helm install profile checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'platform/manifests/charts/**'
      - '.github/workflows/mvp-helm-preflight.yml'
      - '.github/workflows/signed-linux-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'platform/manifests/charts/**'
      - '.github/workflows/mvp-helm-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Render the public MVP with immutable candidate references
        shell: bash
        run: |
          set -euo pipefail
          chart=platform/manifests/charts/m9sweeper
          helm dependency update "$chart"
          sha="$(printf 'a%.0s' {1..64})"
          overrides=(
            --set-string "dash.image.tag=v0.1.0-rc1@sha256:$sha"
            --set-string "trawler.image.tag=v0.1.0-rc1@sha256:$sha"
          )
          helm template m9-mvp "$chart" --namespace m9-mvp-test --kube-version 1.35.0 \
            -f "$chart/values-mvp.example.yaml" "${overrides[@]}" > /tmp/mvp-render.yaml
          grep -q 'kind: Deployment' /tmp/mvp-render.yaml
          # Public MVP runtime Secret references must work in CronJobs too.
          # An obsolete generated name makes cluster inventory silently stop
          # after otherwise successful Helm deployment.
          python3 - <<'PY'
          from pathlib import Path
          yaml = Path('/tmp/mvp-render.yaml').read_text()
          jobs = [x for x in yaml.split('---') if 'kind: CronJob' in x]
          if len(jobs) != 4:
              raise SystemExit(f'Expected four scheduled MVP jobs, found {len(jobs)}')
          for job in jobs:
              if 'name: m9-dash-env' not in job:
                  raise SystemExit('MVP CronJob does not use dash.existingSecret')
              if 'name: m9-mvp-dash-secrets' in job:
                  raise SystemExit('MVP CronJob uses nonexistent autogenerated Secret')
          print('PASS: four scheduled jobs honor pre-created Dash Secret')
          PY

          if grep -q 'kind: StatefulSet' /tmp/mvp-render.yaml; then
            echo 'FAIL: legacy bundled database must not be rendered in public profile' >&2
            exit 1
          fi
          # Helm must reject every unsafe public-beta configuration.
          refuse() {
            if helm template m9-mvp "$chart" -f "$chart/values-mvp.example.yaml" \
              "${overrides[@]}" "$@" > /tmp/mvp-negative.yaml 2>&1; then
              echo 'FAIL: public MVP profile accepted an unsafe configuration' >&2
              exit 1
            fi
          }
          refuse --set global.postgres.enabled=true
          refuse --set global.rabbitmq.enabled=true
          refuse --set-string dash.existingSecret=
          refuse --set-string dash.init.existingSecret=
          refuse --set-string trawler.existingSecret=
          refuse --set-string dash.image.tag=latest
          refuse --set-string trawler.image.tag=latest
          # Candidate workflow must check EXACTLY the same secure profile.
          grep -Fq -- '--set global.mvp.enabled=true' .github/workflows/signed-linux-candidate.yml
          grep -Fq -- '--set global.postgres.enabled=false' .github/workflows/signed-linux-candidate.yml
          grep -Fq -- '--set global.rabbitmq.enabled=false' .github/workflows/signed-linux-candidate.yml
          echo 'PASS: only externally secured, digest-pinned public MVP render accepted'
