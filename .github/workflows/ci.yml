name: Local MVP checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm install --no-audit --no-fund
        working-directory: dash
      - run: npm run build
        working-directory: dash
  trawler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: trawler/go.mod
      - run: go test ./...
        working-directory: trawler
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
  policy-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: m9sweeper
          POSTGRES_PASSWORD: integrationtestpassword
          POSTGRES_DB: m9sweeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m9sweeper -d m9sweeper"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://m9sweeper:integrationtestpassword@localhost:5432/m9sweeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: node test/policy-integration.mjs
        working-directory: backend
