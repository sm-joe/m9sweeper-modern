name: Real queued Trivy staging acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/integration/real-trivy-e2e-staging.py'
      - 'tools/integration/trivy-dlq-staging.py'
      - 'tools/browser-e2e/tests/trivy-staging.spec.cjs'
      - '.github/workflows/real-trivy-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: queued-trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-trivy-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify the real staging scanner launcher syntax
        run: python3 -m py_compile tools/integration/real-trivy-e2e-staging.py tools/integration/trivy-dlq-staging.py
      - name: Bootstrap real disposable NestJS, Angular, PostgreSQL and RabbitMQ
        run: bash tools/integration/runtime-smoke.sh
      - name: Run actual Java Trivy worker and verify durable scan evidence
        env:
          M9_STAGING_E2E_TEST: "YES"
          M9_COMPOSE_PROJECT: m9-runtime
        run: python3 tools/integration/real-trivy-e2e-staging.py
      - name: Set up supported Node.js for standalone Playwright acceptance
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for real Angular scan acceptance
        working-directory: tools/browser-e2e
        env:
          NODE_ENV: development
        run: |
          set -euo pipefail
          # Force devDependencies even if runner npm configuration omits them.
          npm install --include=dev --no-save --package-lock=false --no-audit --no-fund
          node -e "console.log('Resolved @playwright/test:', require.resolve('@playwright/test'))"
          test -x ./node_modules/.bin/playwright
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Verify same real Trivy scan is visible in Angular
        working-directory: tools/browser-e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          NODE_ENV: development
        run: |
          set -euo pipefail
          node -e "require.resolve('@playwright/test')"
          ./node_modules/.bin/playwright test tests/trivy-staging.spec.cjs --project=chromium
      - name: Upload Trivy UI traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-trivy-browser-diagnostics
          path: |
            tools/browser-e2e/test-results/
            tools/browser-e2e/playwright-report/
          if-no-files-found: ignore
      - name: Assert real bounded retries and durable DLQ quarantine
        env:
          M9_STAGING_DLQ_TEST: "YES"
          M9_COMPOSE_PROJECT: m9-runtime
        run: |
          python3 -m pip install --user 'pika==1.3.2'
          python3 tools/integration/trivy-dlq-staging.py
      - name: Print only sanitized Java retry and quarantine outcomes on failure
        if: failure()
        shell: bash
        run: |
          set -o pipefail
          docker compose -f platform/docker-compose/docker-compose.yml -p m9-runtime logs --no-color --tail=150 trawler 2>/dev/null |
            grep -E 'Queued image scan failed|Dash did not acknowledge scan quarantine|Quarantined job retained|Quarantined job|Unable to confirm retry publication' || true
      - name: Show container health without exporting credential-bearing logs
        if: always()
        run: docker compose -f platform/docker-compose/docker-compose.yml -p m9-runtime ps || true
      - name: Tear down disposable CI containers without altering external environments
        if: always()
        run: docker compose -f platform/docker-compose/docker-compose.yml -p m9-runtime down --remove-orphans || true
