name: Scanner acceptance script checks
on:
  pull_request:
    paths:
      - 'scripts/verify-kind-scanners.ps1'
      - 'scripts/verify-falco-kubernetes-linux.sh'
      - '.github/workflows/scanner-acceptance-static.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate native Linux Falco drill syntax
        shell: bash
        run: bash -n scripts/verify-falco-kubernetes-linux.sh
      - name: Parse Windows PowerShell scanner acceptance without executing
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/verify-kind-scanners.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host 'PASS: PowerShell acceptance script parses cleanly'
