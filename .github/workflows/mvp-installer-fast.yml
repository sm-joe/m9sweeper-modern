name: Public MVP staging installer safety checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/install-mvp-staging-linux.sh'
      - '.github/workflows/signed-linux-candidate.yml'
      - '.github/workflows/mvp-installer-fast.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/install-mvp-staging-linux.sh'
      - '.github/workflows/mvp-installer-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shell-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refuse unapproved installation without reaching Kubernetes
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install-mvp-staging-linux.sh
          set +e
          bash scripts/install-mvp-staging-linux.sh >/tmp/mvp-install-refusal 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          grep -q INSTALL_STAGING_ONLY /tmp/mvp-install-refusal
          grep -Fq 'cp scripts/install-mvp-staging-linux.sh dist/install-mvp-staging-linux.sh' .github/workflows/signed-linux-candidate.yml
          grep -Fq 'mvp-installer.sigstore.json' .github/workflows/signed-linux-candidate.yml
          echo 'PASS: staging-only installer refuses implicit installation and candidate packs signed helper'
