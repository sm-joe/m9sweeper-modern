name: EKS scanner chart fast validation
on:
  pull_request:
    paths:
      - 'platform/manifests/charts/kube-bench/**'
      - 'platform/manifests/charts/kube-hunter/**'
      - 'docs/installation.md'
      - 'docs/eks-installation.md'
      - '.github/workflows/eks-scanner-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eks-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: EKS worker scanner render and API-key contract
        shell: bash
        run: |
          set -euo pipefail
          chart=platform/manifests/charts/kube-bench
          helm lint "$chart" --set-string provider=eks \
            --set cronjob.enabled=false \
            --set-string reportAuth.existingSecret=existing-auth \
            --set-string reportAuth.keyName=api-key \
            --set-string reportsurl=http://m9sweeper-dash.m9sweeper-system.svc:3000/api/kube-bench/3
          for scheduled in false true; do
            helm template kube-bench "$chart" --namespace m9sweeper-system \
              --kube-version 1.35.0 --set provider=eks \
              --set cronjob.enabled="$scheduled" \
              --set-string reportAuth.existingSecret=existing-auth \
              --set-string reportAuth.keyName=api-key \
              --set-string reportsurl=http://m9sweeper-dash.m9sweeper-system.svc:3000/api/kube-bench/3 \
              > "/tmp/kube-bench-$scheduled.yaml"
            grep -Fq 'key: "api-key"' "/tmp/kube-bench-$scheduled.yaml"
            grep -Fq -- '--benchmark eks-1.2.0' "/tmp/kube-bench-$scheduled.yaml"
            if grep -Fq 'batch/v1beta1' "/tmp/kube-bench-$scheduled.yaml"; then
              echo "Unsupported CronJob v1beta1 for Kubernetes 1.35" >&2; exit 1
            fi
          done
          echo 'PASS: EKS Job/CronJob use same benchmark, secret key and modern API'
      - name: EKS kube-hunter authenticated relay requires HTTPS and existing bootstrap key
        shell: bash
        run: |
          set -euo pipefail
          chart=platform/manifests/charts/kube-hunter
          # Both one-time and scheduled report relays must use the scoped scanner key.
          for scheduled in false true; do
            helm template kube-hunter "$chart" -n m9sweeper-system \
              --kube-version 1.35.0 \
              --set cronjob.enabled="$scheduled" \
              --set reportRelay.enabled=true \
              --set-string reportRelay.existingSecret=m9-init-env \
              --set-string reportRelay.secretKey=KUBE_HUNTER_API_KEY \
              --set-string reportRelay.targetUrl=https://dash.example.com/api/kubehunter/hunter/1 \
              > "/tmp/kube-hunter-$scheduled.yaml"
            grep -Fq 'name: "m9-init-env"' "/tmp/kube-hunter-$scheduled.yaml"
            grep -Fq 'key: "KUBE_HUNTER_API_KEY"' "/tmp/kube-hunter-$scheduled.yaml"
          done
          # Reject insecure service URLs before any manifest reaches the cluster.
          if helm template kube-hunter "$chart" -n m9sweeper-system \
              --set cronjob.enabled=false --set reportRelay.enabled=true \
              --set-string reportRelay.existingSecret=m9-init-env \
              --set-string reportRelay.targetUrl=http://dash.svc.cluster.local/api/kubehunter/hunter/1 \
              > /tmp/kube-hunter-insecure.yaml 2> /tmp/kube-hunter-insecure.err; then
            echo "ERROR: kube-hunter HTTP relay unexpectedly passed validation" >&2
            exit 1
          fi
          grep -Fq 'must be a full trusted HTTPS URL' /tmp/kube-hunter-insecure.err
          echo 'PASS: kube-hunter relay renders with existing scoped API key and rejects HTTP'
