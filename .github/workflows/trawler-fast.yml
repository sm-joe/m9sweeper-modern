name: Trawler JVM fast checks
on:
  pull_request:
    paths:
      - 'platform/trawler/**'
      - '.github/workflows/trawler-fast.yml'
permissions:
  contents: read
jobs:
  trawler-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: platform/trawler/pom.xml
      - name: Run original Java scanner tests
        run: mvn -B -ntp -f platform/trawler/pom.xml test
      - name: Verify packaged Java scanner contains STS credential provider
        run: |
          mvn -B -ntp -f platform/trawler/pom.xml -DskipTests package
          jar tf platform/trawler/target/trawler.jar | grep -q '^com/amazonaws/services/securitytoken/AWSSecurityTokenService.class$'
          jar tf platform/trawler/target/trawler.jar | grep -q '^com/amazonaws/auth/WebIdentityTokenCredentialsProvider.class$'
