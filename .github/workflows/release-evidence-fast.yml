name: Release evidence contract fast checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/security/check_release_signoff.py'
      - 'tools/security/test_release_signoff.py'
      - 'docs/release-evidence-signoff.md'
      - '.github/workflows/release-evidence-fast.yml'
  push:
    branches: [main]
    paths:
      - 'tools/security/check_release_signoff.py'
      - 'tools/security/test_release_signoff.py'
      - '.github/workflows/release-evidence-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate release evidence fail-closed rules
        run: |
          python3 -m py_compile tools/security/check_release_signoff.py
          python3 -m unittest tools.security.test_release_signoff -v
