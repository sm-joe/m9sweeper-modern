name: Native Linux scanner evidence safety fast checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/verify-native-scanner-evidence-linux.sh'
      - 'docs/native-linux-final-acceptance.md'
      - '.github/workflows/native-scanner-evidence-fast.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify-native-scanner-evidence-linux.sh'
      - '.github/workflows/native-scanner-evidence-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner-evidence-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify syntax and fail-closed opt-in without touching operator infrastructure
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/verify-native-scanner-evidence-linux.sh
          set +e
          bash scripts/verify-native-scanner-evidence-linux.sh >/dev/null 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          echo 'PASS: scanner evidence script rejects unapproved runs'
