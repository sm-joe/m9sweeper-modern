name: Full m9sweeper platform source validation
on:
  push:
    branches: [revamp/original-platform]
    paths:
      - 'platform/**'
      - '.github/workflows/revamp-platform-ci.yml'
      - 'tools/import-platform/**'
  pull_request:
    paths:
      - 'platform/**'
      - 'tools/import-platform/**'
permissions:
  contents: read
jobs:
  source-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate upstream product modules and UI routes
        run: |
          python3 tools/import-platform/verify.py
          python3 tools/import-platform/test_product.py
  original-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform/dash/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: platform/dash/backend/package-lock.json
      - name: Install locked NestJS dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Build original NestJS services
        run: npm run build:api
      - name: Regression test original policy compliance and exception behavior
        run: npm test -- --runInBand
  original-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform/dash/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: platform/dash/frontend/package-lock.json
      - name: Install backend DTO dependencies consumed by the original Angular compiler
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: platform/dash/backend
      - name: Install locked Angular dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Build original Angular application with modernized routes and layout
        run: npm run build:prod
  helm-charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Build vendored Helm subcharts (no public chart repo dependency)
        run: helm dependency update platform/manifests/charts/m9sweeper
      - name: Lint authenticated production values
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          API_KEY="$(openssl rand -hex 32)"
          helm lint platform/manifests/charts/m9sweeper \
            --set-string global.jwtSecret="$JWT_SECRET" \
            --set-string global.apiKey="$API_KEY" \
            --set-string dash.init.superAdminEmail="ci@example.invalid" \
            --set-string dash.init.superAdminPassword="$JWT_SECRET"
      - name: Render Kubernetes resources for a modern API target
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          API_KEY="$(openssl rand -hex 32)"
          helm template m9sweeper platform/manifests/charts/m9sweeper \
            --namespace m9sweeper-system \
            --kube-version 1.31.0 \
            --set-string global.jwtSecret="$JWT_SECRET" \
            --set-string global.apiKey="$API_KEY" \
            --set-string dash.init.superAdminEmail="ci@example.invalid" \
            --set-string dash.init.superAdminPassword="$JWT_SECRET" \
            >/dev/null
  original-trawler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform/trawler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: platform/trawler/pom.xml
      - name: Test and compile existing Java trawler scanner engine
        run: mvn -B -ntp test
  dash-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the actual NestJS + Angular dashboard image, not the old prototype
        uses: docker/build-push-action@v6
        with:
          context: platform
          file: platform/Dockerfile
          push: false
          tags: m9sweeper-modern/dash:ci
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate full original product Compose stack with safe local bindings
        run: |
          cp platform/docker-compose/.env.sample platform/docker-compose/.env
          sed -i 's/^SUPER_ADMIN_EMAIL=.*/SUPER_ADMIN_EMAIL=ci@example.invalid/' platform/docker-compose/.env
          sed -i 's/^SUPER_ADMIN_PASSWORD=.*/SUPER_ADMIN_PASSWORD=ci-secret-strong-2026-test/' platform/docker-compose/.env
          sed -i 's/^SECURITY_JWT_SECRET=.*/SECURITY_JWT_SECRET=ci-jwt-strong-2026-test-0123456789/' platform/docker-compose/.env
          sed -i 's/^DATABASE_PASSWORD=.*/DATABASE_PASSWORD=ci-database-strong-2026-test/' platform/docker-compose/.env
          sed -i 's/^TRAWLER_API_KEY=.*/TRAWLER_API_KEY=ci-trawler-strong-2026-test-012345/' platform/docker-compose/.env
          sed -i 's/^RABBITMQ_USERNAME=.*/RABBITMQ_USERNAME=m9ci/' platform/docker-compose/.env
          sed -i 's/^RABBITMQ_PASSWORD=.*/RABBITMQ_PASSWORD=ci-rabbit-strong-test-0123456789/' platform/docker-compose/.env
          docker compose -f platform/docker-compose/docker-compose.yml --env-file platform/docker-compose/.env config --quiet
          rendered="$(docker compose -f platform/docker-compose/docker-compose.yml --env-file platform/docker-compose/.env config --format json)"
          echo "$rendered" | python3 -c 'import json,sys; d=json.load(sys.stdin); expected={"dash":"3000","postgres":"5432","rabbitmq":"5672","kubesec":"6116"}; [(lambda p: (_ for _ in ()).throw(AssertionError(s)) if any(x.get("host_ip") != "127.0.0.1" for x in p) else None)(d["services"][s].get("ports",[])) for s in expected]; print("Compose public bindings: none")'
  runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Start original complete NestJS/Angular application and prove live admin auth
        run: bash tools/integration/runtime-smoke.sh
      - name: Dump full-stack logs on failure
        if: failure()
        run: docker compose -f platform/docker-compose/docker-compose.yml -p m9-runtime logs --tail=150
      - name: Stop integration stack, keep evidence in CI logs
        if: always()
        run: docker compose -f platform/docker-compose/docker-compose.yml -p m9-runtime down --remove-orphans
