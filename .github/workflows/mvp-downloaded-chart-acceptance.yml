name: Kubernetes release acceptance
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact candidate source SHA
        type: string
        required: true
      candidate_run_id:
        description: Signed candidate run ID
        type: string
        required: true
      confirmation:
        description: Required ACCEPT_CANDIDATE acknowledgement
        type: string
        required: true

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  install-downloaded-release:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'ACCEPT_CANDIDATE' &&
      inputs.source_sha == github.sha &&
      github.repository == 'sm-joe/m9sweeper-modern'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify signed candidate run completed for exact main SHA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]]
          # The candidate dispatches acceptance from its final step, before
          # GitHub transitions the workflow run itself to "completed".
          # Poll that exact run ID, never accept a different source or workflow.
          candidate_ok=0
          for attempt in {1..60}; do
            evidence="$(gh run view "$CANDIDATE_RUN" --json name,headSha,status,conclusion)"
            jq -e --arg sha "$SOURCE_SHA" '
              .name == "Build and sign m9sweeper release"
              and .headSha == $sha' <<<"$evidence" >/dev/null || {
              echo 'Candidate workflow identity or source SHA mismatch' >&2
              exit 1
            }
            if jq -e '.status == "completed" and .conclusion == "success"' <<<"$evidence" >/dev/null; then
              candidate_ok=1
              break
            fi
            if jq -e '.status == "completed"' <<<"$evidence" >/dev/null; then
              echo 'Signed candidate completed without success; release blocked' >&2
              exit 1
            fi
            sleep 5
          done
          [[ "$candidate_ok" == 1 ]] || {
            echo 'Signed candidate did not reach completed/success within bounded verification window' >&2
            exit 1
          }
          echo 'PASS: exact-source signed candidate completed successfully'
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - uses: sigstore/cosign-installer@v3
      - uses: actions/download-artifact@v4
        with:
          name: m9sweeper-signed-linux-candidate-${{ inputs.source_sha }}
          path: dist
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify downloaded Helm chart signature before installation
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          chart="$(find dist -maxdepth 1 -name 'm9sweeper-*.tgz' -type f)"
          [[ -n "$chart" && -s "$chart" ]]
          identity='https://github.com/sm-joe/m9sweeper-modern/.github/workflows/signed-linux-candidate.yml@refs/heads/main'
          issuer='https://token.actions.githubusercontent.com'
          cosign verify-blob --bundle dist/chart.sigstore.json \
            --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$chart"
          printf '%s\n' "$chart" > /tmp/m9-mvp-chart-path
          echo 'PASS: downloaded Helm chart verified'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'
      - name: Install pinned Kind
        shell: bash
        run: |
          set -euo pipefail
          go install sigs.k8s.io/kind@v0.33.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Create isolated supported Kubernetes 1.35 Kind cluster
        shell: bash
        run: |
          set -euo pipefail
          kind create cluster --name m9-mvp-ci \
            --image 'kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0' \
            --wait 180s
          test "$(kubectl config current-context)" = kind-m9-mvp-ci
      - name: Install real signed chart with PostgreSQL 17 and RabbitMQ 4.4
        shell: bash
        env:
          M9_MVP_KIND_CI: APPROVED_GITHUB_CI
        run: |
          set -euo pipefail
          export M9_MVP_CHART="$(cat /tmp/m9-mvp-chart-path)"
          bash scripts/accept-signed-mvp-chart-kind-linux.sh
      - name: Collect nonsecret install failure status
        if: failure()
        shell: bash
        run: |
          set +e
          context=kind-m9-mvp-ci
          ns=m9-mvp-staging
          echo '=== Helm release status ==='
          helm status m9-mvp -n "$ns" 2>&1 | head -70
          echo '=== Workload states (separate calls to preserve failures) ==='
          kubectl --context "$context" -n "$ns" get deployments -o wide 2>&1
          kubectl --context "$context" -n "$ns" get pods -o wide 2>&1
          kubectl --context "$context" -n "$ns" get jobs -o wide 2>&1
          echo '=== Init and container termination/waiting reasons ==='
          kubectl --context "$context" -n "$ns" get pods -o json | python3 -c '
          import json,sys
          try:
              pods=json.load(sys.stdin).get("items",[])
              for pod in pods:
                  meta=pod.get("metadata",{}); status=pod.get("status",{})
                  print(meta.get("name"),"phase="+str(status.get("phase")))
                  for kind in ("initContainerStatuses","containerStatuses"):
                      for c in status.get(kind,[]):
                          state=c.get("state",{})
                          print(" ",c.get("name"),"ready="+str(c.get("ready")),"restarts="+str(c.get("restartCount")),"state="+str(state))
          except Exception as exc:
              print("Cannot parse pod status:",type(exc).__name__)
          ' 2>&1
          echo '=== Pod conditions and Kubernetes scheduling/pull errors ==='
          kubectl --context "$context" -n "$ns" describe pods 2>&1 | tail -260
          echo '=== Recent Kubernetes events ==='
          kubectl --context "$context" -n "$ns" get events --sort-by=.metadata.creationTimestamp 2>&1 | tail -120
          echo '=== Helm install hook Jobs (no Secret values) ==='
          kubectl --context "$context" -n "$ns" describe jobs 2>&1 | tail -120
          echo 'Never print Secrets, environment dumps, or application logs in public CI.'
      - name: Clean up isolated Kind cluster
        if: always()
        shell: bash
        run: kind delete cluster --name m9-mvp-ci || true
