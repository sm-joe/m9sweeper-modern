name: Verify downloaded signed MVP chart on native Linux Kind
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact candidate source SHA
        type: string
        required: true
      candidate_run_id:
        description: Signed candidate run ID
        type: string
        required: true
      confirmation:
        description: Required ACCEPT_CANDIDATE acknowledgement
        type: string
        required: true

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  install-downloaded-release:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'ACCEPT_CANDIDATE' &&
      inputs.source_sha == github.sha &&
      github.repository == 'sm-joe/m9sweeper-modern'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify signed candidate run completed for exact main SHA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]]
          gh run view "$CANDIDATE_RUN" --json name,headSha,status,conclusion |
            jq -e --arg sha "$SOURCE_SHA" '
              .name == "Signed Linux release candidate images and Helm artifact"
              and .headSha == $sha and .status == "completed"
              and .conclusion == "success"' >/dev/null || {
              echo 'Selected candidate is not a successful exact-source signed build' >&2
              exit 1
            }
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - uses: sigstore/cosign-installer@v3
      - uses: actions/download-artifact@v4
        with:
          name: m9sweeper-signed-linux-candidate-${{ inputs.source_sha }}
          path: dist
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify downloaded chart and installer signatures before execution
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          chart="$(find dist -maxdepth 1 -name 'm9sweeper-*.tgz' -type f)"
          [[ -n "$chart" && -s "$chart" ]]
          identity='https://github.com/sm-joe/m9sweeper-modern/.github/workflows/signed-linux-candidate.yml@refs/heads/main'
          issuer='https://token.actions.githubusercontent.com'
          cosign verify-blob --bundle dist/chart.sigstore.json \
            --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$chart"
          cosign verify-blob --bundle dist/mvp-installer.sigstore.json \
            --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" \
            dist/install-mvp-staging-linux.sh
          printf '%s\n' "$chart" > /tmp/m9-mvp-chart-path
          echo 'PASS: downloaded immutable candidate chart and installer verified'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'
      - name: Install pinned Kind
        shell: bash
        run: |
          set -euo pipefail
          go install sigs.k8s.io/kind@v0.33.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Create isolated supported Kubernetes 1.35 Kind cluster
        shell: bash
        run: |
          set -euo pipefail
          kind create cluster --name m9-mvp-ci \
            --image 'kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0' \
            --wait 180s
          test "$(kubectl config current-context)" = kind-m9-mvp-ci
      - name: Install real signed chart with PostgreSQL 17 and RabbitMQ 4.4
        shell: bash
        env:
          M9_MVP_KIND_CI: APPROVED_GITHUB_CI
        run: |
          set -euo pipefail
          export M9_MVP_CHART="$(cat /tmp/m9-mvp-chart-path)"
          bash scripts/accept-signed-mvp-chart-kind-linux.sh
      - name: Collect nonsecret install failure status
        if: failure()
        shell: bash
        run: |
          kubectl --context kind-m9-mvp-ci -n m9-mvp-staging get deployments,pods,jobs,events --sort-by=.metadata.creationTimestamp 2>/dev/null | tail -120 || true
          helm status m9-mvp -n m9-mvp-staging 2>/dev/null | head -45 || true
      - name: Request gated public beta publication after successful acceptance
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          gh workflow run mvp-beta-publication.yml --ref main \
            -f source_sha="$SOURCE_SHA" \
            -f candidate_run_id="$CANDIDATE_RUN" \
            -f acceptance_run_id="$GITHUB_RUN_ID" \
            -f confirmation=SIGNED_AND_ACCEPTED
          echo 'Requested beta publication gate; publication only after this workflow completes successfully'
      - name: Clean up isolated Kind cluster
        if: always()
        shell: bash
        run: kind delete cluster --name m9-mvp-ci || true
