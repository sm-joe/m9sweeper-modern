name: Publish verified m9sweeper-modern public MVP beta
on:
  workflow_run:
    workflows:
      - Verify downloaded signed MVP chart on native Linux Kind
    types: [completed]
permissions:
  contents: write
  actions: read
  packages: read
jobs:
  publish-beta:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.head_repository.full_name == 'sm-joe/m9sweeper-modern'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@v3
      - name: Require exact SHA candidate and full platform success
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$GH_REPO" = 'sm-joe/m9sweeper-modern'
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -s ATTRIBUTION.md
          test -s platform/LICENSE
          test -s docs/mvp-beta-release-notes.md
          if gh release view v0.1.0-beta.1 >/dev/null 2>&1; then
            echo 'Refusing to overwrite existing immutable public beta release' >&2
            exit 1
          fi
          gh run list --workflow revamp-platform-ci.yml --limit 50 \
            --json databaseId,headSha,conclusion > /tmp/platform-runs.json
          jq -e --arg sha "$SOURCE_SHA" \
            'any(.[]; .headSha == $sha and .conclusion == "success")' \
            /tmp/platform-runs.json >/dev/null || {
            echo 'Exact-source full platform CI is not green; public release refused' >&2
            exit 1
          }
          gh run list --workflow signed-linux-candidate.yml --limit 60 \
            --json databaseId,headSha,conclusion > /tmp/candidates.json
          id="$(jq -r --arg sha "$SOURCE_SHA" \
            '[.[] | select(.headSha == $sha and .conclusion == "success") | .databaseId][0] // empty' \
            /tmp/candidates.json)"
          [[ "$id" =~ ^[1-9][0-9]*$ ]] || {
            echo 'No successful signed candidate for exact accepted source SHA' >&2
            exit 1
          }
          echo "CANDIDATE_RUN=$id" >> "$GITHUB_ENV"
      - name: Download artifacts from exactly accepted signed candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$CANDIDATE_RUN" \
            --name "m9sweeper-signed-linux-candidate-$SOURCE_SHA" \
            --dir dist
          (cd dist && sha256sum -c SHA256SUMS)
          test -s dist/m9sweeper-source.spdx.json
          python3 -m json.tool dist/m9sweeper-source.spdx.json >/dev/null
      - name: Independently verify OCI and Helm signatures before release publication
        shell: bash
        run: |
          set -euo pipefail
          identity='https://github.com/sm-joe/m9sweeper-modern/.github/workflows/signed-linux-candidate.yml@refs/heads/main'
          issuer='https://token.actions.githubusercontent.com'
          shopt -s nullglob
          charts=(dist/m9sweeper-*.tgz)
          test "${#charts[@]}" -eq 1
          cosign verify-blob --bundle dist/chart.sigstore.json \
            --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" \
            "${charts[0]}"
          cosign verify-blob --bundle dist/mvp-installer.sigstore.json \
            --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" \
            dist/install-mvp-staging-linux.sh
          for name in dash trawler; do
            image="$(sed -n "s/^$name=//p" dist/IMAGE-DIGESTS.txt)"
            [[ "$image" =~ ^ghcr.io/sm-joe/m9sweeper-(dash|trawler)@sha256:[a-f0-9]{64}$ ]]
            cosign verify --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" "$image" >/dev/null
          done
          echo 'PASS: verified exactly accepted source, signed chart/installer and OCI digests'
      - name: Publish public PRE-RELEASE with verified downloadable assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh release create v0.1.0-beta.1 \
            dist/*.tgz dist/SHA256SUMS dist/IMAGE-DIGESTS.txt \
            dist/chart.sigstore.json dist/mvp-installer.sigstore.json \
            dist/m9sweeper-source.spdx.json dist/RELEASE-METADATA.txt \
            dist/install-mvp-staging-linux.sh dist/mvp_preinstall_secrets.py \
            dist/MVP-INSTALL.md \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title 'm9sweeper-modern v0.1.0 Public Beta' \
            --notes-file docs/mvp-beta-release-notes.md
          echo 'PASS: public beta published ONLY after signed candidate and independent native Kind install/Trivy acceptance'
