name: Build and sign m9sweeper release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v0.1.0'
        required: true
        default: 'v0.1.0'
        type: string
      confirmation:
        description: 'Type BUILD_RELEASE to build the release package'
        required: true
        type: string
permissions:
  contents: read
  packages: write
  id-token: write
  actions: write
jobs:
  candidate:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'BUILD_RELEASE'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate candidate version and release scope
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Release version must be vMAJOR.MINOR.PATCH' >&2
            exit 2
          }
          test -s ATTRIBUTION.md
          test -s platform/LICENSE
          test -s docs/installation.md
          echo 'Release package build is separate from publication; runtime validation follows'
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Dash candidate with OCI provenance and SBOM
        id: dash
        uses: docker/build-push-action@v6
        with:
          context: ./platform
          file: ./platform/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/sm-joe/m9sweeper-dash:${{ inputs.version }}
          provenance: mode=max
          sbom: true
      - name: Build and publish Java trawler candidate with OCI provenance and SBOM
        id: trawler
        uses: docker/build-push-action@v6
        with:
          context: ./platform/trawler
          file: ./platform/trawler/Dockerfile.jvm
          push: true
          platforms: linux/amd64
          tags: ghcr.io/sm-joe/m9sweeper-trawler:${{ inputs.version }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Keyless-sign OCI image digests
        shell: bash
        env:
          DASH_DIGEST: ${{ steps.dash.outputs.digest }}
          TRAWLER_DIGEST: ${{ steps.trawler.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DASH_DIGEST" == sha256:* && "$TRAWLER_DIGEST" == sha256:* ]]
          cosign sign --yes "ghcr.io/sm-joe/m9sweeper-dash@$DASH_DIGEST"
          cosign sign --yes "ghcr.io/sm-joe/m9sweeper-trawler@$TRAWLER_DIGEST"
          identity='https://github.com/sm-joe/m9sweeper-modern/.github/workflows/signed-linux-candidate.yml@refs/heads/main'
          issuer='https://token.actions.githubusercontent.com'
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "ghcr.io/sm-joe/m9sweeper-dash@$DASH_DIGEST"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "ghcr.io/sm-joe/m9sweeper-trawler@$TRAWLER_DIGEST"
          mkdir -p dist
          printf 'dash=ghcr.io/sm-joe/m9sweeper-dash@%s\ntrawler=ghcr.io/sm-joe/m9sweeper-trawler@%s\n' "$DASH_DIGEST" "$TRAWLER_DIGEST" > dist/IMAGE-DIGESTS.txt
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Package Helm values pinned to verified OCI image digests
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          DASH_DIGEST: ${{ steps.dash.outputs.digest }}
          TRAWLER_DIGEST: ${{ steps.trawler.outputs.digest }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("platform/manifests/charts/m9sweeper/values.yaml")
          content = p.read_text()
          for component, old_name, new_name, digest_var in [
              ("Dash", "m9sweeper/dash", "sm-joe/m9sweeper-dash", "DASH_DIGEST"),
              ("Trawler", "m9sweeper/trawler", "sm-joe/m9sweeper-trawler", "TRAWLER_DIGEST"),
          ]:
              digest = os.environ[digest_var]
              if not digest.startswith("sha256:") or len(digest) != 71:
                  raise SystemExit("Invalid published " + component + " digest")
              old = "    repository: " + old_name + "\n    tag: 0.0.0"
              new = "    repository: " + new_name + "\n    tag: " + os.environ["VERSION"] + "@" + digest
              if content.count(old) != 1:
                  raise SystemExit("Unexpected " + component + " image values; refusing unsigned fallback")
              content = content.replace(old, new)
          p.write_text(content)
          PY
          grep -Fq "repository: sm-joe/m9sweeper-dash" platform/manifests/charts/m9sweeper/values.yaml
          grep -Fq "repository: sm-joe/m9sweeper-trawler" platform/manifests/charts/m9sweeper/values.yaml
          helm dependency update platform/manifests/charts/m9sweeper
          helm package platform/manifests/charts/m9sweeper --version "$version" --app-version "$version" --destination dist
          chart="dist/m9sweeper-$version.tgz"
          test -s "$chart"
          tar -xOzf "$chart" m9sweeper/values.yaml | grep -Fq "tag: "$VERSION"@$DASH_DIGEST"
          tar -xOzf "$chart" m9sweeper/values.yaml | grep -Fq "tag: "$VERSION"@$TRAWLER_DIGEST"
          printf 'source_commit=%s\nversion=%s\nstatus=release-build\n' "$(git rev-parse HEAD)" "$VERSION" >dist/RELEASE-METADATA.txt
      - name: Verify signed immutable images in rendered candidate Kubernetes workloads
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          DASH_DIGEST: ${{ steps.dash.outputs.digest }}
          TRAWLER_DIGEST: ${{ steps.trawler.outputs.digest }}
        run: |
          set -euo pipefail
          python3 tools/security/test_candidate_workload_digests.py
          chart="dist/m9sweeper-${VERSION#v}.tgz"
          # Render the actual packaged chart, not a mutable source directory.
          # External Secrets prevent generated bootstrap credentials in CI artifacts.
          helm template m9sweeper "$chart" \
            --namespace m9sweeper-system \
            --kube-version 1.35.0 \
            --set global.installation.enabled=true \
            --set global.postgres.enabled=false \
            --set global.rabbitmq.enabled=false \
            --set-string dash.existingSecret=external-dash-env \
            --set-string trawler.existingSecret=external-trawler-env \
            --set-string dash.init.existingSecret=external-init-env \
            > dist/RENDERED-CANDIDATE.yaml
          python3 tools/security/verify_candidate_workload_digests.py \
            dist/RENDERED-CANDIDATE.yaml "$VERSION" "$DASH_DIGEST" "$TRAWLER_DIGEST"
          if grep -Eq 'kind: StatefulSet|name: .*rabbitmq' dist/RENDERED-CANDIDATE.yaml; then
            echo 'Release chart unexpectedly contains bundled legacy database/broker' >&2
            exit 1
          fi
      - name: Generate source dependency SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/m9sweeper-source.spdx.json
          upload-artifact: false
      - name: Sign candidate Helm chart and verify independent artifacts
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          chart="dist/m9sweeper-${VERSION#v}.tgz"
          # Include the exact operator install helper, Secret check and Linux
          # instructions in the same retained artifact as the verified chart.
          cp scripts/install-mvp-staging-linux.sh dist/install-mvp-staging-linux.sh
          cp tools/security/mvp_preinstall_secrets.py dist/mvp_preinstall_secrets.py
          cp docs/installation.md dist/MVP-INSTALL.md
          chmod 755 dist/install-mvp-staging-linux.sh
          python3 -m json.tool dist/m9sweeper-source.spdx.json >/dev/null
          cosign sign-blob --yes --bundle dist/chart.sigstore.json "$chart"
          cosign sign-blob --yes --bundle dist/mvp-installer.sigstore.json dist/install-mvp-staging-linux.sh
          identity='https://github.com/sm-joe/m9sweeper-modern/.github/workflows/signed-linux-candidate.yml@refs/heads/main'
          issuer='https://token.actions.githubusercontent.com'
          cosign verify-blob --bundle dist/chart.sigstore.json --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$chart"
          cosign verify-blob --bundle dist/mvp-installer.sigstore.json --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" dist/install-mvp-staging-linux.sh
          (cd dist && sha256sum ./*.tgz m9sweeper-source.spdx.json install-mvp-staging-linux.sh mvp_preinstall_secrets.py MVP-INSTALL.md > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Upload immutable-digest candidate manifest, chart and evidence
        uses: actions/upload-artifact@v4
        with:
          name: m9sweeper-signed-linux-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Dispatch independent Kubernetes installation tests
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          gh workflow run mvp-downloaded-chart-acceptance.yml --ref main \
            -f source_sha="$GITHUB_SHA" \
            -f candidate_run_id="$GITHUB_RUN_ID" \
            -f confirmation=ACCEPT_CANDIDATE
          echo 'Signed candidate complete: requested exact-commit real Kind install acceptance'
          echo 'No public release is published unless independent installation and scan pass'

