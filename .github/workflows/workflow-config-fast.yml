name: Workflow configuration fast checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: GitHub Actions YAML parse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate all workflow YAML with Ruby/Psych
        shell: bash
        run: |
          ruby -r yaml -e 'Dir[".github/workflows/*.{yml,yaml}"].each { |file| YAML.parse_file(file); puts "OK: #{file}" }'
