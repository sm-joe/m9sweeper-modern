name: Public MVP Secret preflight fast checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/security/mvp_preinstall_secrets.py'
      - 'tools/security/test_mvp_preinstall_secrets.py'
      - '.github/workflows/mvp-secret-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'tools/security/mvp_preinstall_secrets.py'
      - 'tools/security/test_mvp_preinstall_secrets.py'
      - '.github/workflows/mvp-secret-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-preflight-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Safe offline staging Secret validation regression
        run: |
          python3 -m py_compile tools/security/mvp_preinstall_secrets.py
          python3 -m unittest tools.security.test_mvp_preinstall_secrets -v
      - name: Refuse unapproved access to real Kubernetes Secrets
        run: |
          set +e
          python3 tools/security/mvp_preinstall_secrets.py --namespace m9-mvp-staging >/tmp/preflight-out 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          grep -q 'explicit M9_MVP_PREFLIGHT' /tmp/preflight-out
          echo 'PASS: no Kubernetes reads without operator opt-in'
