name: Correct release numbering and publish v0.1.2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-correct-v012.yml'
  workflow_run:
    workflows:
      - Kubernetes release acceptance
    types: [completed]
  workflow_dispatch:
    inputs:
      acceptance_run_id:
        type: string
        required: true
        description: Successful v0.1.2 independent Kind acceptance run ID
permissions:
  contents: write
  actions: read
  packages: read
jobs:
  correct-version:
    if: >-
      github.repository == 'sm-joe/m9sweeper-modern' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: sm-joe/m9sweeper-modern
      SOURCE_SHA: db16a133bbee494b9c0b2b6a95a70093b43c390d
      VERSION: v0.1.2
      OLD_TAG: v0.1.3
      OLD_SOURCE_SHA: 5de2942871ce236209467d7a9cccbde090631908
    steps:
      - name: Require exact-source signed candidate and platform CI
        shell: bash
        run: |
          set -euo pipefail
          gh run list --workflow ci.yml --limit 100             --json headSha,status,conclusion > /tmp/m9-platform-ci.json
          jq -e --arg sha "$SOURCE_SHA" 'any(.[];
            .headSha == $sha and .status == "completed" and .conclusion == "success")'             /tmp/m9-platform-ci.json >/dev/null || {
              echo 'Exact-source full Platform CI did not pass' >&2; exit 1;
            }
          gh run list --workflow release-build.yml --limit 100             --json databaseId,headSha,status,conclusion > /tmp/m9-signed-candidates.json
          candidate_id="$(jq -r --arg sha "$SOURCE_SHA" '
            [.[] | select(.headSha == $sha and
            .status == "completed" and .conclusion == "success")] |
            sort_by(.databaseId) | last | .databaseId // empty'             /tmp/m9-signed-candidates.json)"
          [[ "$candidate_id" =~ ^[1-9][0-9]*$ ]] || {
            echo 'No signed candidate matching the accepted source commit' >&2; exit 1;
          }
          echo "CANDIDATE_ID=$candidate_id" >> "$GITHUB_ENV"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo 'v0.1.2 is already published; do not overwrite signed assets' >&2; exit 1;
          fi
          echo 'PASS: exact-source Platform CI and signed build'
      - uses: sigstore/cosign-installer@v3
      - name: Download verified artifact and check signed chart/images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$CANDIDATE_ID" \
            --name "m9sweeper-signed-linux-candidate-$SOURCE_SHA" --dir dist
          (cd dist && sha256sum -c SHA256SUMS)
          test -s dist/RELEASE-METADATA.txt
          grep -Fxq "source_commit=$SOURCE_SHA" dist/RELEASE-METADATA.txt
          grep -Fxq "version=$VERSION" dist/RELEASE-METADATA.txt
          chart="dist/m9sweeper-${VERSION#v}.tgz"
          test -s "$chart"
          identity='https://github.com/sm-joe/m9sweeper-modern/.github/workflows/release-build.yml@refs/heads/main'
          issuer='https://token.actions.githubusercontent.com'
          cosign verify-blob --bundle dist/chart.sigstore.json \
            --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$chart"
          for scanner in kube-bench kube-hunter; do
            artifact="dist/$scanner-${VERSION#v}.tgz"
            test -s "$artifact"
            cosign verify-blob --bundle "dist/$scanner.sigstore.json" \
              --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$artifact"
          done
          for name in dash trawler; do
            image="$(sed -n "s/^$name=//p" dist/IMAGE-DIGESTS.txt)"
            [[ "$image" =~ ^ghcr.io/sm-joe/m9sweeper-(dash|trawler)@sha256:[a-f0-9]{64}$ ]]
            cosign verify --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" "$image" >/dev/null
          done
          echo 'PASS: all v0.1.2 Helm archives and immutable OCI digests verified'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'
      - name: Install pinned Kind v0.33.0
        shell: bash
        run: |
          set -euo pipefail
          go install sigs.k8s.io/kind@v0.33.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Create isolated Kind v1.35.8 cluster
        shell: bash
        run: |
          set -euo pipefail
          kind create cluster --name m9-mvp-ci \\
            --image 'kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0' \\
            --wait 180s
          test "$(kubectl config current-context)" = kind-m9-mvp-ci
      - name: Independently install signed v0.1.2 chart and execute real Trivy Kind acceptance
        shell: bash
        env:
          M9_MVP_KIND_CI: APPROVED_GITHUB_CI
          M9_MVP_CHART: dist/m9sweeper-0.1.2.tgz
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bash scripts/accept-release-kind.sh
          echo 'PASS: exact-source signed v0.1.2 Helm installation, auth, Trivy scan and rollback'
      - name: Clean up disposable Kind
        if: always()
        shell: bash
        run: kind delete cluster --name m9-mvp-ci || true
      - name: Publish v0.1.2 as a normal public GitHub release
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/m9-release-notes.txt <<'EOF'
          m9sweeper-modern v0.1.2 — correctly numbered public MVP release.
          
          Includes Angular/NestJS dashboard, Java Trivy Trawler, Kubernetes inventory,
          kube-bench report history/detail improvements, and kube-hunter UI hardening.
          Images and Helm charts are digest-pinned, signed and accompanied by an SBOM.
          
          Verified for this exact source: full Platform CI, signed build, standalone chart
          verification and native Linux Kind Helm installation with actual Trivy scan
          ingestion into PostgreSQL and Dash API.
          
          Limitations: kube-hunter live report ingestion/dashboard and native Falco
          sensor/forwarding acceptance are not yet verified. Validate those capabilities
          in your staging cluster before production use.
          
          Upgrade notes: Use a backup of PostgreSQL and existing nonsecret Helm values.
          The standalone kube-bench and kube-hunter scanner charts are separate assets.
          EOF
          gh release create "$VERSION" \
            dist/*.tgz dist/SHA256SUMS dist/IMAGE-DIGESTS.txt \
            dist/*.sigstore.json dist/m9sweeper-source.spdx.json \
            dist/RELEASE-METADATA.txt dist/INSTALL.md \
            --target "$SOURCE_SHA" \
            --title "m9sweeper-modern $VERSION" \
            --notes-file /tmp/m9-release-notes.txt
          gh release view "$VERSION" --json isDraft,isPrerelease,tagName \
            --jq 'select(.isDraft == false and .isPrerelease == false and .tagName == "v0.1.2") | .tagName' |
            grep -Fxq "$VERSION"
          echo 'PASS: correctly numbered normal v0.1.2 release published'
      - name: Remove incorrectly numbered v0.1.3 release and its tag
        shell: bash
        run: |
          set -euo pipefail
          old_release="$(gh api "repos/$GH_REPO/releases/tags/$OLD_TAG")"
          jq -e --arg sha "$OLD_SOURCE_SHA" '.target_commitish == $sha' \
            <<<"$old_release" >/dev/null || {
            echo 'Old release source changed; refusing automatic deletion' >&2; exit 1;
          }
          gh release delete "$OLD_TAG" --yes --cleanup-tag
          gh release view "$VERSION" --json tagName,isPrerelease
          echo 'PASS: incorrect v0.1.3 GitHub release and tag deleted; v0.1.2 remains public'
