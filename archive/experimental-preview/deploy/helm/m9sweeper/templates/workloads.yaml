{{- range $name := list "dash" "backend" "trawler" }}
{{- $cfg := index $.Values $name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m9-{{ $name }}
  labels:
    app.kubernetes.io/name: m9-{{ $name }}
    {{- include "m9.labels" $ | nindent 4 }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: m9-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: m9-{{ $name }}
    spec:
      serviceAccountName: m9-{{ $name }}
      automountServiceAccountToken: {{ eq $name "trawler" }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ include "m9.image" $cfg.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: M9_COMPONENT
              value: {{ $name | quote }}
            - name: DATABASE_HOST
              value: {{ $.Values.global.postgres.host | quote }}
            - name: DATABASE_PORT
              value: {{ $.Values.global.postgres.port | quote }}
            - name: DATABASE_NAME
              value: {{ $.Values.global.postgres.database | quote }}
            - name: DATABASE_USER
              value: {{ $.Values.global.postgres.username | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.existingSecret }}
                  key: postgres-password
            - name: SECURITY_JWT_SECRET
              {{- if and $.Values.global.security.allowInlineSecrets $.Values.global.jwtSecret }}
              value: {{ $.Values.global.jwtSecret | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.existingSecret }}
                  key: jwt-secret
              {{- end }}
            - name: DEFAULT_SUPER_ADMIN_EMAIL
              {{- if $.Values.dash.init.superAdminEmail }}
              value: {{ $.Values.dash.init.superAdminEmail | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.existingSecret }}
                  key: super-admin-email
              {{- end }}
            - name: DEFAULT_SUPER_ADMIN_PASSWORD
              {{- if and $.Values.global.security.allowInlineSecrets $.Values.dash.init.superAdminPassword }}
              value: {{ $.Values.dash.init.superAdminPassword | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.existingSecret }}
                  key: super-admin-password
              {{- end }}
            - name: M9_AGENT_API_KEY
              {{- if and $.Values.global.security.allowInlineSecrets $.Values.global.apiKey }}
              value: {{ $.Values.global.apiKey | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.existingSecret }}
                  key: agent-api-key
              {{- end }}
          resources:
            {{- if eq $name "trawler" }}
            {{- toYaml $.Values.trawler.resources | nindent 12 }}
            {{- else }}
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 1Gi }
            {{- end }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: m9-backend
spec:
  selector:
    app.kubernetes.io/name: m9-backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: m9-dash
spec:
  selector:
    app.kubernetes.io/name: m9-dash
  ports:
    - name: http
      port: {{ .Values.dash.service.port }}
      targetPort: {{ .Values.dash.service.port }}
